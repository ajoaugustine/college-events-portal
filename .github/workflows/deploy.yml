name: From GitHub to Production

on:
  push:
    branches: [main, "demo/**"]   # demo/** branches run tests only
  pull_request:                   # PRs run tests only
  workflow_dispatch:              # "Run workflow" button in the Actions tab

# Least privilege by default; the deploy job asks for more below.
permissions:
  contents: read

env:
  APP_VERSION: v1.0

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-24.04   # pinned so the runner can't change mid-talk
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Run automated tests
        run: npm test -- --test-reporter=spec | tee test-output.txt

      # Only runs when tests fail: turns each failing test into a red annotation.
      - name: Explain why the pipeline stopped
        if: failure()
        run: |
          grep '^✖' test-output.txt | grep -v 'failing tests' | sed 's/ ([0-9.]*ms)$//' | sort -u |
            while read -r line; do echo "::error title=Failing test::${line#✖ }"; done
          echo "::error title=Production is safe::Tests failed, so build and deploy were skipped."

  build:
    name: Build the site
    needs: test                              # no green tests, no build
    if: github.ref == 'refs/heads/main'      # only main goes to production
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Copy site into dist/
        run: cp -r site dist

      - name: Stamp version into the page
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          DEPLOY_TIME="$(TZ=Asia/Kolkata date '+%d %b %Y, %H:%M IST')"
          sed -i \
            -e "s|__VERSION__|${APP_VERSION}|" \
            -e "s|__COMMIT_SHA__|${SHORT_SHA}|" \
            -e "s|__DEPLOY_TIME__|${DEPLOY_TIME}|" \
            dist/index.html
          echo "Stamped: ${APP_VERSION} · ${SHORT_SHA} · deployed ${DEPLOY_TIME}"
          grep -n "deployed" dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Package the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04   # pinned so the runner can't change mid-talk
    permissions:
      pages: write      # allowed to publish to Pages
      id-token: write   # proves to Pages that this run is really from this repo
    # One deploy at a time; let an in-progress deploy finish instead of cancelling it.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
